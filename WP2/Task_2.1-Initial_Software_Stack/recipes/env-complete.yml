name: lumi-iq-complete
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - jupyterlab
  - ipywidgets
  - scipy
  - scikit-learn
  - pandas
  - networkx
  - dill
  - matplotlib
  - pip:
    - --extra-index-url https://opencode.it4i.eu/api/v4/projects/107/packages/pypi/simple
    - qaas==1.0.0
    - qiskit==2.1.2
    - qiskit-aer==0.17.2
    - pytket-qiskit==0.71.0
    - qiskit-algorithms
    - qiskit-machine-learning
    - qiskit-nature
    - pyscf
    - py4lexis
    - torch
    - qiskit-addon-cutting==0.10.0
    - qiskit-addon-aqc-tensor==0.3.1
    - qiskit-addon-sqd==0.14.1
    - bqskit==1.2.1
    - qc-parallelizer==2.1.1
    - iqm-client[qiskit]==35.0.3
    - iqm-qubit-selector~=1.1.3
    - iqm-error-reduction-tools~=0.2.4
    - iqm-qaoa~=2.0.3
    - fiqci-ems==2.0.0
    - stim
    - pymatching
    - pennylane==0.45.1
    - pennylane-qiskit==0.45.1
