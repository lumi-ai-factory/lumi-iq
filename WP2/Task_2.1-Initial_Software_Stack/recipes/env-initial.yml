# ==============================================================================
# LUMI-IQ Task 2.1 Recipe: Initial Software Stack (Section 3.4.1 Baseline)
# Target: Czech National Quantum Computer (VLQ) & LUMI HPC
#
# Verified Qiskit 2.1.2 & QaaS 1.0.0 production stack for LUMI.
# QCut is provided via qiskit-addon-cutting (native Qiskit 2.x support).
# ==============================================================================
name: lumi-iq-env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - jupyterlab
  - ipywidgets
  - scipy
  - scikit-learn
  - pandas
  - networkx
  - dill
  - matplotlib
  - pip:
    - --extra-index-url https://opencode.it4i.eu/api/v4/projects/107/packages/pypi/simple
    - qaas==1.0.0
    - qiskit==2.1.2
    - qiskit-aer==0.17.2
    - qiskit-algorithms
    - qiskit-machine-learning
    - qiskit-nature
    - pyscf
    - py4lexis
    - torch
    - qiskit-addon-cutting
    - qiskit-addon-aqc-tensor
    - qc-parallelizer
    - stim
    - pymatching
    - pennylane
    - pennylane-qiskit
