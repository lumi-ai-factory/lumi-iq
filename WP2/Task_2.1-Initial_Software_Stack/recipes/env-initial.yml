# ==============================================================================
# LUMI-IQ Task 2.1 Recipe: Initial Software Stack (Section 3.4.1 Baseline)
# Target: Czech National Quantum Computer (VLQ) & LUMI HPC
# Includes all 12 tools specified in Deliverable D2.1 Table 13:
#   - Qiskit IQM (iqm-client[qiskit])
#   - IQM QAOA (iqm-qaoa)
#   - Qiskit Aer (qiskit-aer)
#   - IQM Qubit Selector (iqm-qubit-selector)
#   - IQM Error Reduction Tools (iqm-error-reduction-tools)
#   - FiQCI-EMS (fiqci-ems)
#   - Qiskit AQC-Tensor Addon (qiskit-addon-aqc-tensor)
#   - QCut (circuit-knitting-toolbox)
#   - qc-parallelizer (qc-parallelizer)
#   - PyTorch (torch)
#   - scikit-learn
#   - SciPy
# ==============================================================================
name: lumi-iq-env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - jupyterlab
  - ipywidgets
  - scipy
  - scikit-learn
  - pandas
  - networkx
  - dill
  - matplotlib
  - pip:
    - --extra-index-url https://opencode.it4i.eu/api/v4/projects/107/packages/pypi/simple
    - qiskit-aer
    - qiskit-algorithms
    - qiskit-machine-learning
    - qiskit-nature
    - pyscf
    - py4lexis
    - qaas==0.5.3
    - torch
    - circuit-knitting-toolbox
    - qiskit-addon-aqc-tensor
    - iqm-client[qiskit]
    - iqm-qaoa
    - iqm-qubit-selector
    - iqm-error-reduction-tools
    - fiqci-ems
    - qc-parallelizer
