site_name: LUMI-IQ docs preview
theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections

markdown_extensions:
  - admonition         
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - toc:
      permalink: true

nav:
  - Home: index.md