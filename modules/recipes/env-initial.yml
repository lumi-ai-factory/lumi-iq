# ==============================================================================
# LUMI-IQ Task 2.1 Recipe: Initial Software Stack (Section 3.4.1 Baseline)
# Target: Czech National Quantum Computer (VLQ) & LUMI HPC
#
# Verified Qiskit 2.x & QaaS 0.5.3 production stack for LUMI with:
# - Core Quantum SDK & High-Performance Simulators (Qiskit Aer GPU/CPU)
# - Small-Scale Quantum Error Correction (Stim, PyMatching)
# - Quantum Machine Learning (PennyLane, PyTorch, scikit-learn)
# - Topology-Aware Compilation, Transpilation & Error Mitigation
# ==============================================================================
name: lumi-iq-env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - jupyterlab
  - ipywidgets
  - scipy
  - scikit-learn
  - pandas
  - networkx
  - dill
  - matplotlib
  - truststore
  - pip:
    - --extra-index-url https://opencode.it4i.eu/api/v4/projects/107/packages/pypi/simple
    - qiskit-aer
    - qiskit-algorithms
    - qiskit-machine-learning
    - qiskit-nature
    - pyscf
    - py4lexis
    - py4heappe<4.0.0
    - torch
    - qiskit-addon-aqc-tensor
    - qc-parallelizer
    - stim
    - pymatching
    - pennylane
    - pennylane-qiskit
    - iqm-client[qiskit]
    - iqm-qubit-selector
    - iqm-error-reduction-tools
    - fiqci-ems
    - qiskit-addon-cutting
